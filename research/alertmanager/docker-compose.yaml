services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379"

  aqsh:
    build:
      context: ../../
      dockerfile: Dockerfile
    environment:
      AQSH_MODE: both
      AQSH_REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - redis

  prometheus:
    build:
      context: .
      dockerfile_inline: |
        FROM prom/prometheus:latest
        COPY prometheus.yml /etc/prometheus/prometheus.yml
        COPY alert-rules.yml /etc/prometheus/alert-rules.yml
    ports:
      - "9090:9090"
    depends_on:
      - aqsh

  alertmanager:
    build:
      context: .
      dockerfile_inline: |
        FROM prom/alertmanager:latest
        COPY alertmanager.yml /etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    depends_on:
      - aqsh
