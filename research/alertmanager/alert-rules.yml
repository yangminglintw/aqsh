groups:
  - name: aqsh-test
    rules:
      - alert: HighMemory
        expr: up == 1
        for: 0m
        labels:
          severity: critical
          aqsh_task: alert-handler
        annotations:
          summary: "Test alert for aqsh webhook integration"

      - alert: HighLatency
        expr: up == 1
        for: 0m
        labels:
          severity: warning
          aqsh_task: latency-handler
        annotations:
          summary: "Test alert for multi-route verification"
