apiVersion: v1
kind: Service
metadata:
  name: {{ include "aqsh.fullname" . }}
  labels:
    {{- include "aqsh.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aqsh.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
