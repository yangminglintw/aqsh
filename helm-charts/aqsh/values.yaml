image:
  repository: aqsh
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  mode: both
  bind: "0.0.0.0:8080"
  tasksConfig: /etc/aqsh/tasks.yaml
  tasksDir: /tasks
  workerQueues: "default,long-running"
  workerConcurrency: 10
  logRetention: 24h
  resultRetention: 72h
  identityHeader: "X-Forwarded-User"
  requireIdentity: false
  groupsHeader: "X-Forwarded-Groups"

redis:
  addr: "redis:6379"
  password: ""
  db: 0
  sentinel:
    enabled: false
    master: mymaster
    addrs: []

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

waitForRedis:
  enabled: true
  image: busybox:1.36

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []
extraEnv: []

# Override content (used by umbrella charts)
# If set, overrides files/tasks.yaml
tasksConfigContent: ""
# If set, overrides files/scripts/*
# Example:
#   scriptsContent:
#     my-script.sh: |
#       #!/bin/bash
#       echo "hello"
scriptsContent: {}
